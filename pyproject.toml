[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-web-os"
version = "0.1.0"
description = "Signal-driven account access planning platform for complex B2B sales."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "mudrezzz" }]
dependencies = [
  "alembic>=1.13",
  "celery>=5.4",
  "fastapi>=0.115",
  "openpyxl>=3.1",
  "pydantic>=2",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
api = [
  "uvicorn[standard]>=0.30",
]
agent = [
  "httpx>=0.27",
  "langgraph-dai @ git+https://github.com/mudrezzz/langgraph-document-ai-platform.git@main#subdirectory=backend/packages",
  "python-dotenv>=1.0",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
power-web-os-demo = "power_web_os.demo:main"
power-web-os-api = "power_web_os.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live_dadata: opt-in live DaData API probes; requires POWER_WEB_OS_RUN_LIVE_DADATA_TESTS=1 and local credentials",
]
