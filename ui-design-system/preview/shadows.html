<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="preview.css"></head>
<body style="background:var(--paper)">
<div class="col" style="gap:16px">
  <div class="row" style="gap:20px">
    <div class="col" style="gap:9px;align-items:center"><div style="width:64px;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 1px 2px rgba(25,27,30,.05)"></div><span class="mono" style="font-size:10px;color:var(--fg3)">xs</span></div>
    <div class="col" style="gap:9px;align-items:center"><div style="width:64px;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 1px 2px rgba(25,27,30,.04),0 2px 6px rgba(25,27,30,.05)"></div><span class="mono" style="font-size:10px;color:var(--fg3)">sm</span></div>
    <div class="col" style="gap:9px;align-items:center"><div style="width:64px;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 2px 4px rgba(25,27,30,.04),0 8px 20px rgba(25,27,30,.07)"></div><span class="mono" style="font-size:10px;color:var(--fg3)">md</span></div>
    <div class="col" style="gap:9px;align-items:center"><div style="width:64px;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 4px 8px rgba(25,27,30,.05),0 18px 40px rgba(25,27,30,.10)"></div><span class="mono" style="font-size:10px;color:var(--fg3)">lg</span></div>
  </div>
  <span class="meta">Soft, diffuse, low-opacity elevation — airy not heavy. xs/sm rest on surfaces; md/lg lift menus & popovers.</span>
</div>
</body></html>
