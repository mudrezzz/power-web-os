<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="preview.css"></head>
<body>
<div class="col" style="gap:14px">
  <div class="row" style="gap:12px">
    <div style="display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow-xs);width:240px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888D94" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="font:400 14px/1 var(--font-sans);color:var(--fg3)">Search accounts, people…</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--cobalt);box-shadow:0 0 0 3px color-mix(in oklab,var(--cobalt) 45%,transparent);width:170px">
      <span style="font:400 14px/1 var(--font-sans);color:var(--ink)">Northwind</span><span style="width:1.5px;height:16px;background:var(--cobalt);margin-left:1px"></span>
    </div>
  </div>
  <div class="row" style="gap:14px;align-items:center">
    <div style="width:38px;height:22px;border-radius:999px;background:var(--cobalt);padding:2px;display:flex;justify-content:flex-end"><span style="width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--shadow-xs)"></span></div>
    <div style="width:38px;height:22px;border-radius:999px;background:var(--surface-3);padding:2px;display:flex"><span style="width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--shadow-xs)"></span></div>
    <span class="meta">Inputs &amp; toggles · rest, focus (cobalt ring), on / off.</span>
  </div>
</div>
</body></html>
