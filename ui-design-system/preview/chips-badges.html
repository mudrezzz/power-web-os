<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="preview.css">
<style>
  .badge { display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font:600 11.5px/1 var(--font-sans); }
  .chip { display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:530 13px/1 var(--font-sans);background:var(--surface);border:1px solid var(--border);color:var(--fg2); }
  .chip.on { background:var(--cobalt-50);border-color:var(--cobalt-200);color:var(--cobalt-700); }
</style></head>
<body>
<div class="col" style="gap:13px">
  <div class="row" style="gap:8px">
    <span class="badge" style="color:var(--ally);background:var(--ally-tint)">● Ally</span>
    <span class="badge" style="color:var(--blocker);background:var(--blocker-tint)">● Blocker</span>
    <span class="badge" style="color:var(--unsurfaced);background:var(--unsurfaced-tint)">● Unsurfaced</span>
    <span class="badge" style="color:var(--cobalt-700);background:var(--cobalt-50)">Recommended</span>
    <span class="badge" style="color:var(--fg2);background:var(--surface-2)">Procurement</span>
  </div>
  <div class="row" style="gap:8px">
    <span class="chip on">All accounts</span>
    <span class="chip">My book</span>
    <span class="chip">Needs route</span>
    <span class="chip">Blocker active</span>
  </div>
  <span class="meta">Pill badges label stance & role; pill chips drive filters. Tinted backgrounds, never loud fills.</span>
</div>
</body></html>
