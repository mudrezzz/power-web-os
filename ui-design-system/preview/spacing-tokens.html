<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="preview.css"></head>
<body>
<div class="col" style="gap:11px">
  <span class="eyebrow" style="margin-bottom:2px">4pt base · spacing scale</span>
  <div class="row" style="gap:8px;align-items:flex-end">
    <div class="col" style="align-items:center;gap:5px"><div style="width:4px;height:16px;background:var(--cobalt-200)"></div><span class="mono" style="font-size:9.5px;color:var(--fg3)">4</span></div>
    <div class="col" style="align-items:center;gap:5px"><div style="width:8px;height:22px;background:var(--cobalt-200)"></div><span class="mono" style="font-size:9.5px;color:var(--fg3)">8</span></div>
    <div class="col" style="align-items:center;gap:5px"><div style="width:12px;height:28px;background:var(--cobalt-200)"></div><span class="mono" style="font-size:9.5px;color:var(--fg3)">12</span></div>
    <div class="col" style="align-items:center;gap:5px"><div style="width:16px;height:34px;background:#9fb0f5"></div><span class="mono" style="font-size:9.5px;color:var(--fg3)">16</span></div>
    <div class="col" style="align-items:center;gap:5px"><div style="width:24px;height:42px;background:#7d93ef"></div><span class="mono" style="font-size:9.5px;color:var(--fg3)">24</span></div>
    <div class="col" style="align-items:center;gap:5px"><div style="width:32px;height:50px;background:var(--cobalt)"></div><span class="mono" style="font-size:9.5px;color:var(--fg3)">32</span></div>
    <div class="col" style="align-items:center;gap:5px"><div style="width:48px;height:60px;background:var(--cobalt-600)"></div><span class="mono" style="font-size:9.5px;color:var(--fg3)">48</span></div>
  </div>
  <span class="meta">Generous, consistent rhythm. 16 / 24 are the workhorses for card padding and section gaps.</span>
</div>
</body></html>
