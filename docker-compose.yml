services:
  redis:
    image: redis:7-alpine
    ports:
      - "${POWER_WEB_OS_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      POWER_WEB_OS_DATABASE_URL: sqlite:////app/demo/output/power_web_os.sqlite3
      POWER_WEB_OS_CELERY_BROKER_URL: redis://redis:6379/0
      POWER_WEB_OS_CELERY_RESULT_BACKEND: redis://redis:6379/1
      POWER_WEB_OS_SQLITE_JOURNAL_MODE: DELETE
    volumes:
      - ./demo/output:/app/demo/output
      - ./.env:/app/.env:ro
    command: >
      sh -c "python -m alembic upgrade head
      && python -m power_web_os.demo seed-radar-db
      && python -m power_web_os.persistence reconcile-radar-output-summaries"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      POWER_WEB_OS_ENV: docker
      POWER_WEB_OS_DATABASE_URL: sqlite:////app/demo/output/power_web_os.sqlite3
      POWER_WEB_OS_CELERY_BROKER_URL: redis://redis:6379/0
      POWER_WEB_OS_CELERY_RESULT_BACKEND: redis://redis:6379/1
      POWER_WEB_OS_SQLITE_JOURNAL_MODE: DELETE
      POWER_WEB_OS_CORS_ORIGINS: ${POWER_WEB_OS_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    ports:
      - "${POWER_WEB_OS_API_HOST_PORT:-8001}:8000"
    volumes:
      - ./demo/output:/app/demo/output
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    command: ["uvicorn", "power_web_os.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      POWER_WEB_OS_ENV: docker
      POWER_WEB_OS_DATABASE_URL: sqlite:////app/demo/output/power_web_os.sqlite3
      POWER_WEB_OS_CELERY_BROKER_URL: redis://redis:6379/0
      POWER_WEB_OS_CELERY_RESULT_BACKEND: redis://redis:6379/1
      POWER_WEB_OS_SQLITE_JOURNAL_MODE: DELETE
    volumes:
      - ./demo/output:/app/demo/output
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "power_web_os.jobs.radar_jobs.radar_celery_app", "worker", "--loglevel=INFO", "--pool=solo", "-Q", "candidate_discovery,signal_monitoring"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_POWER_WEB_OS_API_BASE_URL: ${VITE_POWER_WEB_OS_API_BASE_URL:-http://127.0.0.1:8001}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    command: ["npm", "exec", "vite", "--", "--host", "0.0.0.0"]
